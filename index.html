<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>まりリス｜ぽこぽこブロックパズル</title>
<style>
  :root {
    --ink: #514665;
    --cream: #fffaf0;
    --lavender: #eee8ff;
    --pink: #ff8db4;
    --mint: #8fe0c1;
    --blue: #87d9f5;
    --yellow: #ffd86f;
    --purple: #b9a0ff;
  }
  * { box-sizing: border-box; }
  html { background: var(--cream); }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    color: var(--ink);
    font-family: "Trebuchet MS", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background:
      radial-gradient(circle at 8% 8%, #ffe1ed 0 5%, transparent 5.5%),
      radial-gradient(circle at 94% 15%, #dff8ed 0 4%, transparent 4.5%),
      linear-gradient(145deg, #fffaf0, #f4efff 75%, #eafaff);
    display: flex; justify-content: center; align-items: flex-start;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid #7562bd; outline-offset: 3px; }
  .app { width: min(100%, 900px); }
  header { text-align: center; margin: 0 0 14px; }
  .brand { display: inline-flex; align-items: center; gap: 9px; }
  .cat-mascot { font-size: 34px; filter: saturate(1.05); }
.mascot {
    width: 46px; height: 46px; display: grid; place-items: center;
    border-radius: 16px; background: linear-gradient(145deg, #ffb8d1, #c7b5ff);
    box-shadow: 0 4px 0 #d8c5ee; font-size: 27px; transform: rotate(-5deg);
  }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); letter-spacing: .04em; }
  .subtitle { margin: 5px 0 0; font-size: 13px; color: #827794; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 16px; align-items: start; }
  .game-card, .side-card {
    border: 2px solid #fff; border-radius: 24px; background: rgba(255,255,255,.78);
    box-shadow: 0 8px 22px rgba(102, 79, 137, .12);
  }
  .game-card { padding: 12px; }
  .board-wrap { position: relative; width: min(100%, 390px); margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; border-radius: 14px; }
  #board { background: #f0eaff; border: 2px solid #fff; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; border-radius: 14px;
    background: rgba(255,250,240,.88); backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: clamp(24px, 5vw, 32px); margin: 0 0 7px; }
  .overlay p { margin: 0 0 14px; font-size: 13px; line-height: 1.6; }
  .primary {
    border-radius: 999px; padding: 11px 20px; font-weight: 800;
    background: linear-gradient(135deg, #ff9ec0, #c2aaff); box-shadow: 0 4px 0 #d4b5ed;
  }
  .primary:active, .control:active { transform: translateY(2px); box-shadow: none; }
  .side { display: grid; gap: 12px; }
  .side-card { padding: 14px; }
  .stat-label { font-size: 11px; font-weight: 800; color: #9588a7; letter-spacing: .08em; }
  .score { font-size: 30px; line-height: 1.2; font-weight: 900; margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
  .stat-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 5px 0; }
  .stat-row strong { font-variant-numeric: tabular-nums; }
  .next-title { margin-bottom: 8px; }
  #next { width: 100%; max-width: 130px; margin: auto; background: #f8f4ff; border-radius: 12px; }
  .next-box { text-align: center; }
  .combo {
    min-height: 36px; display: grid; place-items: center; text-align: center; margin-top: 10px;
    font-size: 18px; font-weight: 1000; color: #ff6da7; text-shadow: 1px 2px #ffe2ef;
  }
  .combo.pop { animation: pop .42s ease-out; }
  @keyframes pop { 0% { transform: scale(.65) rotate(-4deg); } 65% { transform: scale(1.2) rotate(3deg); } 100% { transform: scale(1); } }
  .action-row { display: flex; gap: 8px; margin-top: 12px; }
  .action-row button { flex: 1; border-radius: 13px; padding: 10px 6px; background: #f0eaff; font-size: 13px; font-weight: 800; }
  .hint { font-size: 12px; line-height: 1.6; color: #827794; margin: 10px 2px 0; }
  .mobile-controls { display: none; margin: 12px auto 0; max-width: 350px; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .control {
    min-height: 48px; border-radius: 15px; font-size: 21px; font-weight: 900;
    background: linear-gradient(145deg, #fff, #eee8ff); box-shadow: 0 3px 0 #d9cfee;
    user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  .control small { display: block; font-size: 10px; }
  .footer { text-align: center; color: #9a8eaa; font-size: 11px; margin: 14px 0 0; }
  @media (max-width: 650px) {
    body { padding: 10px; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .side { grid-template-columns: 1fr 1fr; align-items: stretch; }
    .side-card { padding: 11px; }
    .score { font-size: 25px; }
    .next-box { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #next { width: 92px; margin: 0; }
    .mobile-controls { display: grid; }
    .hint { display: none; }
    .action-row { margin-top: 10px; }
    .board-wrap { width: min(100%, 360px); }
  }
  @media (max-width: 360px) {
    body { padding: 6px; }
    .game-card { padding: 7px; }
    .side { gap: 7px; }
    .mobile-controls { gap: 5px; }
    .control { min-height: 44px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mascot cat-mascot" aria-label="まりんの猫">🐈</div><h1>まりリス</h1></div>
    <p class="subtitle">ぽこぽこ積んで、キラキラ連鎖！</p>
  </header>

  <main class="layout">
    <section class="game-card" aria-label="ゲーム画面">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600" aria-label="10列20行のゲーム盤"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">準備はいい？</h2>
          <p id="overlayText">ブロックをそろえて、ハイスコアを目指そう！</p>
          <button class="primary" id="startBtn">ゲームスタート！</button>
        </div>
      </div>
      <div class="mobile-controls" aria-label="タッチ操作">
        <button class="control" data-action="left" aria-label="左へ">◀<small>左</small></button>
        <button class="control" data-action="right" aria-label="右へ">▶<small>右</small></button>
        <button class="control" data-action="rotate" aria-label="回転">⟳<small>回転</small></button>
        <button class="control" data-action="down" aria-label="下へ">▼<small>下へ</small></button>
        <button class="control" data-action="drop" style="grid-column: span 4" aria-label="高速落下">⚡ 高速落下</button>
      </div>
      <div class="action-row">
        <button id="pauseBtn">⏸ 一時停止</button>
        <button id="restartBtn">↻ 最初から</button>
      </div>
      <p class="hint">キーボード：← → 移動 ／ ↑ または X 回転 ／ ↓ 下へ ／ Space 高速落下 ／ P 一時停止 ／ Enter 開始・再挑戦</p>
    </section>

    <aside class="side">
      <section class="side-card">
        <div class="stat-label">YOUR SCORE</div>
        <div class="score" id="score">0</div>
        <div class="stat-row"><span>消した列</span><strong id="lines">0</strong></div>
        <div class="stat-row"><span>レベル</span><strong id="level">1</strong></div>
        <div class="stat-row"><span>最高スコア</span><strong id="best">0</strong></div>
      </section>
      <section class="side-card next-box">
        <div><div class="stat-label next-title">NEXT BLOCK</div><div class="hint" style="display:block">次はどの形？</div></div>
        <canvas id="next" width="120" height="100" aria-label="次のブロック"></canvas>
      </section>
      <section class="side-card" style="grid-column: 1 / -1">
        <div class="stat-label">COMBO</div>
        <div class="combo" id="combo">列を消してコンボ！</div>
        <div class="hint" style="display:block">連続で列を消すとボーナス得点！3コンボ以上でキラキラ演出が出るよ ✨</div>
      </section>
    </aside>
  </main>
  <p class="footer">まりリス © オリジナルミニゲーム ｜ 外部通信なし</p>
</div>

<script>
(() => {
  "use strict";

  // ===== 基本設定 =====
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;
  const COLORS = {
    I: "#79d8f2", O: "#ffd66e", T: "#b6a0ff",
    S: "#8cdeb8", Z: "#ff8fb3", J: "#8ca8ff", L: "#ffb17e"
  };

  // 7種類のブロック形状。数字1の場所にブロックがある。
  const SHAPES = {
    I: [[1, 1, 1, 1]],
    O: [[1, 1], [1, 1]],
    T: [[0, 1, 0], [1, 1, 1]],
    S: [[0, 1, 1], [1, 1, 0]],
    Z: [[1, 1, 0], [0, 1, 1]],
    J: [[1, 0, 0], [1, 1, 1]],
    L: [[0, 0, 1], [1, 1, 1]]
  };

  const boardCanvas = document.getElementById("board");
  const ctx = boardCanvas.getContext("2d");
  const nextCanvas = document.getElementById("next");
  const nextCtx = nextCanvas.getContext("2d");
  const $ = (id) => document.getElementById(id);

  let board, current, nextPiece;
  let score = 0, lines = 0, level = 1, combo = 0, best = loadBest();
  let state = "ready"; // ready, playing, paused, over
  let dropCounter = 0, lastTime = 0, animationId = 0;
  let particles = [];
  let comboTimeout = null;

  function loadBest() {
    try { return Number(localStorage.getItem("mariris-best") || 0); }
    catch (_) { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem("mariris-best", String(best)); }
    catch (_) { /* 保存できなくてもゲームは続行する */ }
  }
  function makeBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }
  function randomPiece() {
    const keys = Object.keys(SHAPES);
    const type = keys[Math.floor(Math.random() * keys.length)];
    const matrix = SHAPES[type].map(row => row.slice());
    return { type, matrix, x: Math.floor((COLS - matrix[0].length) / 2), y: 0 };
  }
  function rotateMatrix(matrix) {
    // 行列を時計回りに回転する。
    return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
  }
  function collides(piece, dx = 0, dy = 0, matrix = piece.matrix) {
    for (let y = 0; y < matrix.length; y++) {
      for (let x = 0; x < matrix[y].length; x++) {
        if (!matrix[y][x]) continue;
        const bx = piece.x + x + dx;
        const by = piece.y + y + dy;
        if (bx < 0 || bx >= COLS || by >= ROWS) return true;
        if (by >= 0 && board[by][bx]) return true;
      }
    }
    return false;
  }
  function spawnPiece() {
    current = nextPiece || randomPiece();
    current.x = Math.floor((COLS - current.matrix[0].length) / 2);
    current.y = 0;
    nextPiece = randomPiece();
    drawNext();
    if (collides(current)) endGame();
  }
  function startGame() {
    cancelAnimationFrame(animationId);
    board = makeBoard();
    score = 0; lines = 0; level = 1; combo = 0;
    dropCounter = 0; lastTime = 0; particles = [];
    current = null; nextPiece = randomPiece();
    state = "playing";
    $("overlay").classList.add("hidden");
    $("combo").textContent = "列を消してコンボ！";
    spawnPiece();
    updateStats();
    draw();
    animationId = requestAnimationFrame(loop);
  }
  function endGame() {
    state = "over";
    if (score > best) { best = score; saveBest(); }
    updateStats();
    $("overlayTitle").textContent = "ゲームオーバー！";
    $("overlayText").textContent = `今回のスコアは ${score.toLocaleString()} 点！ もう一回チャレンジする？`;
    $("startBtn").textContent = "もう一回あそぶ";
    $("overlay").classList.remove("hidden");
    draw();
  }
  function togglePause() {
    if (state === "playing") {
      state = "paused";
      $("overlayTitle").textContent = "ちょっと休憩♪";
      $("overlayText").textContent = "準備ができたら再開しよう！";
      $("startBtn").textContent = "ゲーム再開";
      $("overlay").classList.remove("hidden");
    } else if (state === "paused") {
      state = "playing";
      lastTime = 0;
      $("overlay").classList.add("hidden");
      animationId = requestAnimationFrame(loop);
    }
  }
  function move(dx, dy = 0) {
    if (state !== "playing" || !current) return false;
    if (!collides(current, dx, dy)) {
      current.x += dx; current.y += dy;
      draw();
      return true;
    }
    return false;
  }
  function rotate() {
    if (state !== "playing" || !current) return;
    const rotated = rotateMatrix(current.matrix);
    // 壁際では少し横にずらす「壁蹴り」を試して、回転しやすくする。
    for (const offset of [0, -1, 1, -2, 2]) {
      if (!collides(current, offset, 0, rotated)) {
        current.x += offset;
        current.matrix = rotated;
        draw();
        return;
      }
    }
  }
  function softDrop() {
    if (move(0, 1)) {
      score += 1;
      updateStats();
    } else {
      lockPiece();
    }
  }
  function hardDrop() {
    if (state !== "playing" || !current) return;
    let distance = 0;
    while (!collides(current, 0, 1)) {
      current.y++;
      distance++;
    }
    score += distance * 2;
    lockPiece();
  }
  function lockPiece() {
    if (!current || state !== "playing") return;
    for (let y = 0; y < current.matrix.length; y++) {
      for (let x = 0; x < current.matrix[y].length; x++) {
        if (!current.matrix[y][x]) continue;
        const bx = current.x + x, by = current.y + y;
        if (by < 0) { endGame(); return; }
        board[by][bx] = current.type;
      }
    }
    clearLines();
    if (state === "playing") spawnPiece();
    updateStats();
    draw();
  }
  function clearLines() {
    let cleared = 0;
    // 盤面を下から調べ、埋まった行は取り除く。複数行も安全に処理する。
    for (let y = ROWS - 1; y >= 0; y--) {
      if (board[y].every(cell => cell !== null)) {
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        y++; // 行を削除したので同じ位置をもう一度チェックする。
      }
    }
    if (cleared > 0) {
      lines += cleared;
      combo += 1;
      const basePoints = [0, 100, 300, 500, 800][Math.min(cleared, 4)];
      const comboBonus = Math.max(0, combo - 1) * 50;
      score += basePoints * level + comboBonus;
      level = Math.floor(lines / 10) + 1;
      showCombo(cleared);
      // 消した行に星の粒子を出す。
      for (let i = 0; i < cleared * 12; i++) {
        particles.push({
          x: Math.random() * boardCanvas.width,
          y: Math.random() * boardCanvas.height,
          vx: (Math.random() - 0.5) * 2.4,
          vy: -Math.random() * 2.5 - .5,
          life: 28 + Math.random() * 20,
          color: ["#ff8fb3", "#ffd66e", "#8cdeb8", "#8ca8ff"][Math.floor(Math.random() * 4)]
        });
      }
    } else {
      // 1個ブロックを固定するたび、列を消せなければコンボは途切れる。
      combo = 0;
      $("combo").textContent = "次のコンボを狙おう！";
    }
  }
  function showCombo(cleared) {
    const label = combo >= 2 ? `${combo} COMBO! ✨` : (cleared >= 2 ? `${cleared} LINE CLEAR!` : "LINE CLEAR! ✨");
    const el = $("combo");
    el.textContent = label;
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
    if (combo >= 3) {
      for (let i = 0; i < 24; i++) {
        particles.push({
          x: Math.random() * boardCanvas.width, y: Math.random() * boardCanvas.height * .65,
          vx: (Math.random() - .5) * 3, vy: Math.random() * 2 + .5,
          life: 35 + Math.random() * 25,
          color: ["#ff8fb3", "#ffd66e", "#8cdeb8", "#b6a0ff", "#79d8f2"][Math.floor(Math.random() * 5)]
        });
      }
    }
    if (comboTimeout) clearTimeout(comboTimeout);
    comboTimeout = setTimeout(() => {
      if (state === "playing" && combo > 0) {
        // コンボの表示は残し、次の列消去で数字を更新する。
      }
    }, 900);
  }
  function updateStats() {
    $("score").textContent = score.toLocaleString();
    $("lines").textContent = lines.toLocaleString();
    $("level").textContent = level;
    $("best").textContent = Math.max(best, score).toLocaleString();
  }
  function drawBlock(context, x, y, size, color, inset = 0.45, type = "O") {
    // ブロック同士のすき間を小さくして、まとまりが見やすいデザインにする。
    const px = x * size + inset, py = y * size + inset;
    const w = size - inset * 2, r = Math.max(2, size * .16);
    context.fillStyle = color;
    roundRect(context, px, py, w, w, r);
    context.fill();

    // やわらかなハイライトと控えめな輪郭
    context.fillStyle = "rgba(255,255,255,.28)";
    roundRect(context, px + w * .12, py + w * .08, w * .76, Math.max(1.5, w * .10), r * .45);
    context.fill();
    context.strokeStyle = "rgba(93,70,120,.18)";
    context.lineWidth = 0.8;
    roundRect(context, px + .35, py + .35, w - .7, w - .7, r);
    context.stroke();

    // ブロックに顔文字風の表情をつける。小さい画面でも見えるよう短い表情を使用。
    const faces = {
      I: " ^_^ ", O: " >_< ", T: " ^▽^ ",
      S: " *_* ", Z: " ;_; ", J: " ^o^ ", L: " >▽< "
    };
    // 描画中のブロック自身の種類(type)から表情を決める。
    // 盤面に固定されたブロックも、次のブロックも表情が変わらない。
    const face = faces[type] || " ^_^ ";
    context.save();
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.font = `bold ${Math.max(7, Math.min(10, size * .31))}px system-ui, sans-serif`;
    context.fillStyle = "rgba(77,57,83,.88)";
    context.fillText(face, px + w / 2, py + w * .60, w * .92);
    context.restore();
  }
  function roundRect(context, x, y, w, h, r) {
    context.beginPath();
    context.moveTo(x + r, y);
    context.arcTo(x + w, y, x + w, y + h, r);
    context.arcTo(x + w, y + h, x, y + h, r);
    context.arcTo(x, y + h, x, y, r);
    context.arcTo(x, y, x + w, y, r);
    context.closePath();
  }
  function drawGrid() {
    ctx.fillStyle = "#f0eaff";
    ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
    ctx.strokeStyle = "rgba(126,107,160,.13)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
    }
  }
  function draw() {
    drawGrid();
    if (board) {
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (board[y][x]) drawBlock(ctx, x, y, CELL, COLORS[board[y][x]], 0.45, board[y][x]);
        }
      }
    }
    if (current && state !== "over") {
      // 落下位置のゴーストを薄く表示する。
      let ghostY = current.y;
      while (!collides({ ...current, y: ghostY }, 0, 1)) ghostY++;
      ctx.globalAlpha = .22;
      for (let y = 0; y < current.matrix.length; y++) for (let x = 0; x < current.matrix[y].length; x++) {
        if (current.matrix[y][x]) drawBlock(ctx, current.x + x, ghostY + y, CELL, COLORS[current.type], 0.45, current.type);
      }
      ctx.globalAlpha = 1;
      for (let y = 0; y < current.matrix.length; y++) for (let x = 0; x < current.matrix[y].length; x++) {
        if (current.matrix[y][x]) drawBlock(ctx, current.x + x, current.y + y, CELL, COLORS[current.type], 0.45, current.type);
      }
    }
    // 軽い粒子演出
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 45));
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  function drawNext() {
    nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    nextCtx.fillStyle = "#f8f4ff";
    nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextPiece) return;
    const matrix = nextPiece.matrix, size = 21;
    const width = matrix[0].length * size, height = matrix.length * size;
    const startX = (nextCanvas.width - width) / 2, startY = (nextCanvas.height - height) / 2;
    for (let y = 0; y < matrix.length; y++) for (let x = 0; x < matrix[y].length; x++) {
      if (matrix[y][x]) drawBlock(nextCtx, (startX / size) + x, (startY / size) + y, size, COLORS[nextPiece.type], 0.45, nextPiece.type);
    }
  }
  function loop(time = 0) {
    if (state !== "playing") return;
    const delta = lastTime ? Math.min(time - lastTime, 100) : 0;
    lastTime = time;
    dropCounter += delta;
    const interval = Math.max(120, 800 - (level - 1) * 65);
    if (dropCounter >= interval) {
      if (!collides(current, 0, 1)) current.y++;
      else lockPiece();
      dropCounter = 0;
    }
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.life--;
      return p.life > 0;
    });
    draw();
    if (state === "playing") animationId = requestAnimationFrame(loop);
  }

  // ===== 入力処理 =====
  document.addEventListener("keydown", event => {
    const key = event.key;
    if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(key)) event.preventDefault();
    if (key === "Enter") {
      if (state === "ready" || state === "over") startGame();
      else if (state === "paused") togglePause();
      return;
    }
    if (key.toLowerCase() === "p") { togglePause(); return; }
    if (state !== "playing") return;
    if (key === "ArrowLeft") move(-1);
    else if (key === "ArrowRight") move(1);
    else if (key === "ArrowDown") softDrop();
    else if (key === "ArrowUp" || key.toLowerCase() === "x") rotate();
    else if (key === " ") hardDrop();
  });
  $("startBtn").addEventListener("click", () => {
    if (state === "paused") togglePause();
    else startGame();
  });
  $("pauseBtn").addEventListener("click", togglePause);
  $("restartBtn").addEventListener("click", startGame);

  // タッチボタンは、pointerイベントに加えてclickも受け付ける。
  // 一部のスマホ内ブラウザでpointerdownが届かない場合でも操作できるようにする。
  document.querySelectorAll("[data-action]").forEach(button => {
    let holdTimer = null, repeatTimer = null;
    let lastPointerActionAt = 0;
    let longPressTriggered = false;
    const action = button.dataset.action;
    const runAction = () => {
      if (action === "left") move(-1);
      else if (action === "right") move(1);
      else if (action === "rotate") rotate();
      else if (action === "down") softDrop();
      else if (action === "drop") hardDrop();
    };
    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      lastPointerActionAt = Date.now();
      longPressTriggered = false;
      runAction();
      if (["left", "right", "down"].includes(action)) {
        holdTimer = setTimeout(() => {
          longPressTriggered = true;
          repeatTimer = setInterval(runAction, action === "down" ? 75 : 115);
        }, 260);
      }
    });
    // clickはフォールバック。pointerdown直後のclickでは二重操作しない。
    button.addEventListener("click", event => {
      event.preventDefault();
      if (Date.now() - lastPointerActionAt < 500) return;
      runAction();
    });
    const stopHold = () => {
      clearTimeout(holdTimer);
      clearInterval(repeatTimer);
      holdTimer = null;
      repeatTimer = null;
    };
    button.addEventListener("pointerup", stopHold);
    button.addEventListener("pointercancel", stopHold);
    button.addEventListener("pointerleave", stopHold);
    button.addEventListener("contextmenu", event => event.preventDefault());
  });

  // タブを離れて戻った際に、経過時間分だけ一気に落ちるのを防ぐ。
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "playing") {
      state = "paused";
      $("overlayTitle").textContent = "一時停止中";
      $("overlayText").textContent = "戻ってきたら再開してね！";
      $("startBtn").textContent = "ゲーム再開";
      $("overlay").classList.remove("hidden");
    }
  });

  // 初期画面
  board = makeBoard();
  current = null;
  nextPiece = randomPiece();
  drawNext();
  draw();
  updateStats();
})();
</script>
</body>
</html>
